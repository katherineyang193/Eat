<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今天吃什麼？上菜囉！</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#493b35;background:radial-gradient(circle at 15% 15%,#fff8c9 0 8%,transparent 20%),radial-gradient(circle at 85% 10%,#ffd9e8 0 7%,transparent 20%),linear-gradient(135deg,#fff7e8,#e8f8ff)}.app{width:min(1080px,94vw);margin:auto;padding:28px 0 40px}header{text-align:center}.badge{display:inline-block;background:#fff;padding:7px 16px;border-radius:999px;box-shadow:0 5px 16px #0001;font-weight:700;color:#ff6b6b}h1{margin:10px 0 3px;font-size:clamp(34px,6vw,58px);letter-spacing:2px}.subtitle{margin:0 0 22px;color:#7b6c65}.layout{display:grid;grid-template-columns:minmax(300px,1.25fr) minmax(280px,.75fr);gap:24px}.card{background:#ffffffe8;border:3px solid #fff;border-radius:28px;box-shadow:0 16px 35px #8b75651c}.wheel-card{padding:22px;text-align:center}.wheel-wrap{width:min(500px,90vw);aspect-ratio:1;margin:4px auto 16px;position:relative}canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 15px #80665024)}.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid #ff5f72;filter:drop-shadow(0 4px 3px #0003);z-index:3}.center-dot{position:absolute;left:50%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:9px solid #ffcc5c;box-shadow:0 4px 12px #0002;display:grid;place-items:center;font-size:31px;z-index:2}.spin-btn{border:0;border-radius:999px;padding:15px 48px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff6b6b,#ff9f43);box-shadow:0 8px 0 #db514f,0 13px 24px #ff756833;cursor:pointer}.spin-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #db514f}.spin-btn:disabled{opacity:.65;cursor:not-allowed}.result{min-height:90px;margin:22px auto 2px;padding:13px 18px;border-radius:20px;background:#fff7d6;border:2px dashed #ffcc5c;display:flex;flex-direction:column;justify-content:center}.result small{color:#927e67;font-weight:700}.result strong{font-size:30px;color:#f05b62}.result.pop strong{animation:pop .65s ease}@keyframes pop{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}.menu-card{padding:24px}.menu-title{font-size:24px;font-weight:900}.hint{font-size:14px;color:#8c7d75;margin:5px 0 16px}.items{display:grid;gap:9px;max-height:500px;overflow:auto}.item{display:flex;align-items:center;gap:9px;padding:10px 11px;background:#fff9f1;border-radius:15px}.item span{flex:1;font-weight:700}.item button{border:0;background:transparent;cursor:pointer;font-size:18px;border-radius:9px;padding:4px 7px}.item button:hover{background:#ffe6e6}.add{display:flex;gap:8px;margin-top:15px}input{min-width:0;flex:1;border:2px solid #f1ddd1;border-radius:14px;padding:11px 13px;font-size:16px;outline:0}.add button{border:0;border-radius:14px;padding:0 17px;background:#63c7b2;color:#fff;font-weight:900;cursor:pointer}.empty{text-align:center;color:#9a8b83;padding:20px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.confetti i{position:absolute;top:-30px;width:10px;height:18px;animation:fall 1.5s ease-out forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:780px){.layout{grid-template-columns:1fr}.wheel-wrap{width:min(430px,88vw)}.items{max-height:340px}}
</style></head><body><div class="app"><header><div class="badge">🍴 今日的命運由轉盤決定</div><h1>今天吃什麼？</h1><p class="subtitle">上菜囉！讓轉盤幫你結束每天最困難的問題。</p></header><main class="layout"><section class="card wheel-card"><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel"></canvas><div class="center-dot">🍽️</div></div><button id="spin" class="spin-btn">🎡 開始轉！</button><div id="result" class="result"><small>今天吃什麼？</small><strong>等你來抽！</strong></div></section><section class="card menu-card"><div class="menu-title">🍱 我的餐點</div><div class="hint">可以自由新增或刪除，轉盤會立即更新。</div><div id="items" class="items"></div><div class="add"><input id="newItem" maxlength="20" placeholder="輸入餐點名稱，例如：牛肉麵"><button id="addBtn">＋ 新增</button></div></section></main></div><div id="confetti" class="confetti"></div>
<script>
const defaults=["便當","壽司","拉麵","炒飯","雞肉飯","肉羹麵","餛飩麵","隨便青菜","雞排"];let items=JSON.parse(localStorage.getItem("todayEatItems")||"null")||defaults.slice(),rotation=0,spinning=false;
const c=document.getElementById("wheel"),x=c.getContext("2d"),spin=document.getElementById("spin"),res=document.getElementById("result"),list=document.getElementById("items"),input=document.getElementById("newItem"),colors=["#ffcf5c","#ff8fa3","#7dd3c7","#91b8ff","#c6a8ff","#ff9f68","#8ed081","#f7a8d8","#ffd37a"];
function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}addEventListener("resize",resize);
function draw(){let w=c.clientWidth,h=c.clientHeight,cx=w/2,cy=h/2,r=Math.min(w,h)/2-8,s=Math.PI*2/items.length;x.clearRect(0,0,w,h);if(!items.length){x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle="#f3eee9";x.fill();x.fillStyle="#8c7d75";x.font="bold 22px sans-serif";x.textAlign="center";x.fillText("請先新增餐點",cx,cy);return}items.forEach((n,i)=>{let a=rotation+i*s-Math.PI/2,b=a+s;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,a,b);x.closePath();x.fillStyle=colors[i%colors.length];x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.stroke();x.save();let m=a+s/2;x.translate(cx+Math.cos(m)*r*.62,cy+Math.sin(m)*r*.62);x.rotate(m+Math.PI/2);x.fillStyle="#493b35";x.font="900 "+Math.max(13,Math.min(22,190/items.length))+"px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(n.length>7?n.slice(0,7)+"…":n,0,0);x.restore()});x.beginPath();x.arc(cx,cy,r,0,7);x.strokeStyle="#fff";x.lineWidth=7;x.stroke()}
function render(){list.innerHTML="";if(!items.length){list.innerHTML='<div class="empty">目前沒有餐點，先加一個吧 🍜</div>';return}items.forEach((n,i)=>{let q=document.createElement("div");q.className="item";q.innerHTML='<span>🍽️ '+n.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))+'</span><button>🗑️</button>';q.querySelector("button").onclick=()=>{items.splice(i,1);save();render();draw()};list.appendChild(q)})}function save(){localStorage.setItem("todayEatItems",JSON.stringify(items))}
function add(){let n=input.value.trim();if(!n||items.includes(n))return;items.push(n);input.value="";save();render();draw()}document.getElementById("addBtn").onclick=add;input.onkeydown=e=>e.key==="Enter"&&add();
function confetti(){let b=document.getElementById("confetti");b.innerHTML="";for(let i=0;i<70;i++){let p=document.createElement("i");p.style.left=Math.random()*100+"vw";p.style.background=colors[i%colors.length];p.style.transform="rotate("+Math.random()*360+"deg)";p.style.animationDelay=Math.random()*.35+"s";p.style.width=7+Math.random()*8+"px";p.style.height=10+Math.random()*13+"px";b.appendChild(p)}setTimeout(()=>b.innerHTML="",1900)}
function go(){if(spinning||!items.length)return;spinning=true;spin.disabled=true;res.classList.remove("pop");let k=Math.floor(Math.random()*items.length),s=Math.PI*2/items.length,target=-k*s-s/2,current=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2),delta=target-current;while(delta<0)delta+=Math.PI*2;let st=rotation,en=rotation+(6+Math.random()*2)*Math.PI*2+delta,t0=performance.now();function f(now){let t=Math.min(1,(now-t0)/4200),e=1-Math.pow(1-t,4);rotation=st+(en-st)*e;draw();if(t<1)requestAnimationFrame(f);else{rotation=en%(Math.PI*2);res.querySelector("small").textContent="🎉 上菜囉！今天吃";res.querySelector("strong").textContent=items[k]+"！";res.classList.add("pop");confetti();spinning=false;spin.disabled=false}}requestAnimationFrame(f)}spin.onclick=go;render();resize();
</script></body></html>
