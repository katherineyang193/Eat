<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今天吃什麼？上菜囉！</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#493b35;background:linear-gradient(#dff7ff 0 48%,#c9f0bd 48% 100%);overflow-x:hidden}
body:before,body:after{content:"✦";position:fixed;color:#fff;font-size:34px;opacity:.75;animation:float 4s ease-in-out infinite;pointer-events:none}
body:before{left:6%;top:12%}body:after{right:8%;top:22%;animation-delay:1.3s}
@keyframes float{50%{transform:translateY(-12px) rotate(12deg)}}
.app{width:min(1100px,94vw);margin:auto;padding:24px 0 42px}
header{text-align:center}.badge{display:inline-flex;gap:7px;align-items:center;background:#fff;border:3px solid #5fc4b1;padding:7px 16px;border-radius:999px;box-shadow:0 5px 0 #3fa894;font-weight:900;color:#e95b67}
h1{margin:12px 0 2px;font-size:clamp(34px,6vw,58px);letter-spacing:2px;color:#45372f;text-shadow:3px 4px 0 #fff}
.subtitle{margin:0 0 20px;color:#5d766f;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(320px,1.25fr) minmax(290px,.75fr);gap:22px}
.card{background:#fffffff2;border:4px solid #fff;border-radius:30px;box-shadow:0 14px 0 #65b99c55,0 20px 35px #527b6d2b}
.wheel-card{padding:20px;text-align:center}
.wheel-wrap{width:min(500px,88vw);aspect-ratio:1;margin:3px auto 15px;position:relative}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 15px 10px #526d5928)}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:38px solid #ef5b67;filter:drop-shadow(0 4px 2px #0004);z-index:4}
.pointer:after{content:"";position:absolute;left:-8px;top:-36px;width:16px;height:8px;border-radius:50%;background:#fff6;transform:rotate(180deg)}
.center-dot{position:absolute;left:50%;top:50%;width:82px;height:82px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(#fff 0 46%,#f05c68 46% 54%,#fff 54%);border:7px solid #45372f;box-shadow:0 4px 12px #0003;display:grid;place-items:center;font-size:28px;z-index:3}
.center-dot span{background:#fff;border:4px solid #45372f;width:25px;height:25px;border-radius:50%;display:block}
.spin-btn{border:0;border-radius:999px;padding:15px 48px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(135deg,#f05b67,#ff9d4d);box-shadow:0 7px 0 #c84755,0 13px 24px #ff756833;cursor:pointer;transition:.12s}
.spin-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c84755}.spin-btn:disabled{opacity:.65;cursor:not-allowed}
.result{min-height:88px;margin:20px auto 2px;padding:12px 18px;border-radius:20px;background:#fff8c9;border:3px dashed #efbd45;display:flex;flex-direction:column;justify-content:center}
.result small{color:#8a765d;font-weight:800}.result strong{font-size:30px;color:#ed5965}.result.pop strong{animation:pop .65s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
.menu-card{padding:21px}.menu-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.menu-title{font-size:24px;font-weight:900}.hint{font-size:14px;color:#7e8f89;margin:5px 0 13px}
select{width:100%;border:3px solid #73c7b5;background:#f3fffb;border-radius:15px;padding:11px 13px;font-size:17px;font-weight:900;color:#4c665f;outline:0}
.menu-actions{display:flex;gap:7px;margin:9px 0 14px}.mini{border:0;border-radius:12px;padding:8px 10px;font-weight:900;cursor:pointer;background:#ffe18a;color:#70552b}.mini.danger{background:#ffe0e4;color:#bd4f5b}
.items{display:grid;gap:9px;max-height:390px;overflow:auto}.item{display:flex;align-items:center;gap:9px;padding:10px 11px;background:#f6fff7;border:2px solid #d9f0df;border-radius:15px}.item span{flex:1;font-weight:800}.item button{border:0;background:transparent;cursor:pointer;font-size:18px;border-radius:9px;padding:4px 7px}.item button:hover{background:#ffe6e6}
.add{display:flex;gap:8px;margin-top:14px}input{min-width:0;flex:1;border:2px solid #d8e9df;border-radius:14px;padding:11px 13px;font-size:16px;outline:0}.add button{border:0;border-radius:14px;padding:0 16px;background:#5fc4b1;color:#fff;font-weight:900;cursor:pointer}
.empty{text-align:center;color:#9a8b83;padding:20px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.confetti i{position:absolute;top:-30px;width:10px;height:18px;animation:fall 1.5s ease-out forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:780px){.layout{grid-template-columns:1fr}.wheel-wrap{width:min(430px,86vw)}.items{max-height:320px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="badge">⚡ 今日冒險任務・尋找美食！</div>
<h1>今天吃什麼？</h1>
<p class="subtitle">上菜囉！讓幸運轉盤替你決定今天的美食夥伴。</p>
</header>
<main class="layout">
<section class="card wheel-card">
<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel"></canvas><div class="center-dot"><span>✨</span></div></div>
<button id="spin" class="spin-btn">🎡 開始轉！</button>
<div id="result" class="result"><small>今天吃什麼？</small><strong>等你來抽！</strong></div>
</section>
<section class="card menu-card">
<div class="menu-head"><div class="menu-title">🎒 我的美食圖鑑</div></div>
<div class="hint">不同情境可以建立不同菜單，資料只會保存在你的瀏覽器。</div>
<select id="menuSelect"></select>
<div class="menu-actions"><button class="mini" id="newMenu">＋ 新菜單</button><button class="mini" id="copyMenu">📋 複製</button><button class="mini" id="renameMenu">✏️ 改名</button><button class="mini danger" id="deleteMenu">🗑️ 刪除</button></div><div class="menu-actions"><button class="mini" id="exportData">💾 匯出設定</button><button class="mini" id="importData">📥 匯入設定</button><input id="fileInput" type="file" accept=".json,application/json" hidden></div>
<div id="items" class="items"></div>
<div class="add"><input id="newItem" maxlength="20" placeholder="輸入餐點，例如：牛肉麵"><button id="addBtn">＋ 新增</button></div>
</section>
</main>
</div>
<div id="confetti" class="confetti"></div>
<script>
const DEFAULTS=["便當","壽司","拉麵","炒飯","雞肉飯","肉羹麵","餛飩麵","隨便青菜","雞排"];
const DEFAULT_MENUS={
 "🍱 午餐":DEFAULTS,
 "🍰 下午茶":["蛋糕","餅乾","鬆餅","奶茶","咖啡","冰淇淋"]
};
let menus=JSON.parse(localStorage.getItem("todayEatMenus")||"null")||Object.fromEntries(Object.entries(DEFAULT_MENUS).map(([k,v])=>[k,v.slice()])),current=localStorage.getItem("todayEatCurrent")||Object.keys(menus)[0],rotation=0,spinning=false;
if(!menus[current])current=Object.keys(menus)[0];
const c=document.getElementById("wheel"),x=c.getContext("2d"),spin=document.getElementById("spin"),res=document.getElementById("result"),list=document.getElementById("items"),input=document.getElementById("newItem"),select=document.getElementById("menuSelect"),colors=["#ffcf5c","#ff8fa3","#70d0c0","#91b8ff","#c5a8ff","#ff9f68","#8ed081","#f3a7d4","#ffd37a","#7fd4ed"];
function currentItems(){return menus[current]||[]}
function save(){localStorage.setItem("todayEatMenus",JSON.stringify(menus));localStorage.setItem("todayEatCurrent",current)}
function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}addEventListener("resize",resize);
function draw(){let items=currentItems(),w=c.clientWidth,h=c.clientHeight,cx=w/2,cy=h/2,r=Math.min(w,h)/2-8;x.clearRect(0,0,w,h);if(!items.length){x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle="#edf5ef";x.fill();x.fillStyle="#81918b";x.font="bold 22px sans-serif";x.textAlign="center";x.fillText("請先新增餐點",cx,cy);return}let s=Math.PI*2/items.length;items.forEach((n,i)=>{let a=rotation+i*s-Math.PI/2,b=a+s;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,a,b);x.closePath();x.fillStyle=colors[i%colors.length];x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.stroke();x.save();let m=a+s/2;x.translate(cx+Math.cos(m)*r*.62,cy+Math.sin(m)*r*.62);x.rotate(m+Math.PI/2);x.fillStyle="#493b35";x.font="900 "+Math.max(13,Math.min(22,190/items.length))+"px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(n.length>7?n.slice(0,7)+"…":n,0,0);x.restore()});x.beginPath();x.arc(cx,cy,r,0,7);x.strokeStyle="#fff";x.lineWidth=8;x.stroke()}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function renderMenus(){select.innerHTML=Object.keys(menus).map(n=>"<option>"+esc(n)+"</option>").join("");select.value=current}
function render(){renderMenus();list.innerHTML="";let items=currentItems();if(!items.length){list.innerHTML='<div class="empty">目前沒有餐點，先加一個吧 🍜</div>';return}items.forEach((n,i)=>{let q=document.createElement("div");q.className="item";q.innerHTML="<span>🍽️ "+esc(n)+"</span><button>🗑️</button>";q.querySelector("button").onclick=()=>{if(spinning)return;items.splice(i,1);save();render();draw()};list.appendChild(q)})}
select.onchange=()=>{if(spinning)return;current=select.value;rotation=0;save();render();draw();res.querySelector("small").textContent=current;res.querySelector("strong").textContent="等你來抽！"};
document.getElementById("newMenu").onclick=()=>{if(spinning)return;let n=prompt("新菜單名稱，例如：🌙 晚餐");if(!n||!n.trim())return;n=n.trim();if(menus[n]){alert("這個菜單已經存在囉！");return}menus[n]=[];current=n;save();render();draw()};
document.getElementById("copyMenu").onclick=()=>{if(spinning)return;let n=prompt("複製成新的菜單名稱",current+" 副本");if(!n||!n.trim())return;n=n.trim();if(menus[n]){alert("這個菜單已經存在囉！");return}menus[n]=currentItems().slice();current=n;save();render();draw()};
document.getElementById("renameMenu").onclick=()=>{if(spinning)return;let n=prompt("新的菜單名稱",current);if(!n||!n.trim()||n.trim()===current)return;n=n.trim();if(menus[n]){alert("這個菜單已經存在囉！");return}menus[n]=menus[current];delete menus[current];current=n;save();render();draw()};
document.getElementById("exportData").onclick=()=>{let payload={app:"today-eat",version:1,exportedAt:new Date().toISOString(),current,menus};let blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="我的美食設定.json";a.click();URL.revokeObjectURL(url)};
document.getElementById("importData").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data||data.app!=="today-eat"||typeof data.menus!=="object"||!Object.keys(data.menus).length)throw new Error("invalid");let clean={};for(let [name,items] of Object.entries(data.menus)){if(typeof name!=="string"||!name.trim()||!Array.isArray(items))continue;clean[name.trim()]=items.filter(v=>typeof v==="string"&&v.trim()).map(v=>v.trim()).filter((v,i,a)=>a.indexOf(v)===i)}if(!Object.keys(clean).length)throw new Error("invalid");if(!confirm("匯入後會取代目前的個人菜單設定，確定要繼續嗎？"))return;menus=clean;current=clean[data.current] ? data.current : Object.keys(clean)[0];rotation=0;save();render();draw();res.querySelector("small").textContent=current;res.querySelector("strong").textContent="匯入完成！";alert("美食設定已成功匯入 🎉")}catch(err){alert("這個檔案不是有效的美食設定檔。") }e.target.value=""};
document.getElementById("deleteMenu").onclick=()=>{if(spinning)return;let names=Object.keys(menus);if(names.length<=1){alert("至少保留一個菜單喔！");return}if(!confirm("確定要刪除「"+current+"」嗎？"))return;delete menus[current];current=Object.keys(menus)[0];save();render();draw()};
function add(){if(spinning)return;let n=input.value.trim(),items=currentItems();if(!n||items.includes(n))return;items.push(n);input.value="";save();render();draw()}document.getElementById("addBtn").onclick=add;input.onkeydown=e=>e.key==="Enter"&&add();
function confetti(){let b=document.getElementById("confetti");b.innerHTML="";for(let i=0;i<75;i++){let p=document.createElement("i");p.style.left=Math.random()*100+"vw";p.style.background=colors[i%colors.length];p.style.transform="rotate("+Math.random()*360+"deg)";p.style.animationDelay=Math.random()*.35+"s";p.style.width=7+Math.random()*8+"px";p.style.height=10+Math.random()*13+"px";b.appendChild(p)}setTimeout(()=>b.innerHTML="",1900)}
function go(){let items=currentItems();if(spinning||!items.length)return;spinning=true;spin.disabled=true;res.classList.remove("pop");let k=Math.floor(Math.random()*items.length),s=Math.PI*2/items.length,target=-k*s-s/2,currentAngle=((rotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2),delta=target-currentAngle;while(delta<0)delta+=Math.PI*2;let st=rotation,en=rotation+(6+Math.random()*2)*Math.PI*2+delta,t0=performance.now();function f(now){let t=Math.min(1,(now-t0)/4200),e=1-Math.pow(1-t,4);rotation=st+(en-st)*e;draw();if(t<1)requestAnimationFrame(f);else{rotation=((en%(Math.PI*2))+Math.PI*2)%(Math.PI*2);let finalAngle=(((-rotation)%(Math.PI*2))+Math.PI*2)%(Math.PI*2),selectedIndex=Math.min(items.length-1,Math.floor(finalAngle/s));res.querySelector("small").textContent="🎉 上菜囉！今天吃";res.querySelector("strong").textContent=items[selectedIndex]+"！";res.classList.add("pop");confetti();spinning=false;spin.disabled=false}}requestAnimationFrame(f)}spin.onclick=go;
render();resize();
</script>
</body>
</html>
